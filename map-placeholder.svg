<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#f5f5f7"/>
  <rect x="0" y="0" width="800" height="500" fill="#e8f5e9" opacity="0.5"/>
  
  <!-- Trees/forest background -->
  <circle cx="120" cy="100" r="40" fill="#4caf50" opacity="0.3"/>
  <circle cx="180" cy="80" r="35" fill="#66bb6a" opacity="0.3"/>
  <circle cx="80" cy="140" r="30" fill="#43a047" opacity="0.3"/>
  <circle cx="650" cy="90" r="45" fill="#4caf50" opacity="0.3"/>
  <circle cx="720" cy="120" r="35" fill="#66bb6a" opacity="0.3"/>
  <circle cx="700" cy="60" r="30" fill="#43a047" opacity="0.3"/>
  <circle cx="100" cy="400" r="35" fill="#4caf50" opacity="0.3"/>
  <circle cx="160" cy="420" r="30" fill="#66bb6a" opacity="0.3"/>
  <circle cx="680" cy="400" r="40" fill="#4caf50" opacity="0.3"/>
  <circle cx="740" cy="380" r="30" fill="#66bb6a" opacity="0.3"/>
  
  <!-- Main roads -->
  <path d="M0 250 L800 250" stroke="#bdbdbd" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 0 L400 500" stroke="#bdbdbd" stroke-width="8" stroke-linecap="round"/>
  <path d="M200 100 L600 400" stroke="#bdbdbd" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/>
  <path d="M600 100 L200 400" stroke="#bdbdbd" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 8"/>
  
  <!-- Road labels -->
  <rect x="50" y="240" width="100" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="100" y="254" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle" font-weight="500">Jl. Raya Puncak</text>
  
  <rect x="410" y="50" width="20" height="80" rx="4" fill="white" opacity="0.9"/>
  <text x="420" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#666" text-anchor="middle" font-weight="500" transform="rotate(-90 420 95)">Jl. Taman Safari</text>
  
  <!-- Main venue - Taman Safari -->
  <rect x="300" y="170" width="200" height="160" rx="16" fill="white" stroke="#1d1d1f" stroke-width="2"/>
  <rect x="300" y="170" width="200" height="40" rx="16" fill="#1d1d1f"/>
  <rect x="300" y="190" width="200" height="20" fill="#1d1d1f"/>
  <text x="400" y="196" font-family="system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="600">TAMAN SAFARI</text>
  
  <!-- Safari icon -->
  <text x="400" y="250" font-size="48" text-anchor="middle">🦁</text>
  <text x="400" y="290" font-family="system-ui, sans-serif" font-size="11" fill="#666" text-anchor="middle">Indonesia Bogor</text>
  <text x="400" y="306" font-family="system-ui, sans-serif" font-size="10" fill="#86868b" text-anchor="middle">Jl. Raya Puncak No.1, Cisarua</text>
  
  <!-- Pin marker -->
  <g transform="translate(400, 155)">
    <path d="M0 0 C-12 -12 -18 -28 -18 -38 C-18 -49 -9 -58 0 -58 C9 -58 18 -49 18 -38 C18 -28 12 -12 0 0Z" fill="#ea4335"/>
    <circle cx="0" cy="-38" r="8" fill="white"/>
  </g>
  
  <!-- Nearby locations -->
  <g transform="translate(150, 200)">
    <rect x="-50" y="-12" width="100" height="24" rx="6" fill="white" stroke="#e5e5ea" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#1d1d1f" text-anchor="middle" font-weight="500">🏨 TSI Resort</text>
  </g>
  
  <g transform="translate(650, 200)">
    <rect x="-50" y="-12" width="100" height="24" rx="6" fill="white" stroke="#e5e5ea" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#1d1d1f" text-anchor="middle" font-weight="500">🍜 Food Court</text>
  </g>
  
  <g transform="translate(150, 320)">
    <rect x="-50" y="-12" width="100" height="24" rx="6" fill="white" stroke="#e5e5ea" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#1d1d1f" text-anchor="middle" font-weight="500">🐼 Istana Panda</text>
  </g>
  
  <g transform="translate(650, 320)">
    <rect x="-55" y="-12" width="110" height="24" rx="6" fill="white" stroke="#e5e5ea" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#1d1d1f" text-anchor="middle" font-weight="500">🌧️ Rain Forest</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(30, 460)">
    <rect x="0" y="0" width="200" height="30" rx="6" fill="white" opacity="0.9"/>
    <circle cx="18" cy="15" r="5" fill="#ea4335"/>
    <text x="30" y="19" font-family="system-ui, sans-serif" font-size="10" fill="#666">Lokasi Utama</text>
    <line x1="90" y1="10" x2="110" y2="10" stroke="#bdbdbd" stroke-width="2"/>
    <text x="118" y="14" font-family="system-ui, sans-serif" font-size="10" fill="#666">Jalan</text>
  </g>
</svg>
